version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: mailpass
      MYSQL_DATABASE: docker_bmi_db
      MYSQL_USER: tejas
      MYSQL_PASSWORD: mailpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb/init.sql:/docker-entrypoint-initdb.d/init.sql  # Mounting init script
    networks:
      - mynetwork

  spring-app:
    build:
      dockerfile: Dockerfile
    container_name: bmi_spring-boot-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-container:3306/docker_bmi_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: tejas
      SPRING_DATASOURCE_PASSWORD: mailpass
    depends_on:
      - mysql
    networks:
      - mynetwork

networks:
  mynetwork:

volumes:
  mysql_data: