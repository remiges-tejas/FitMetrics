#production [using docker-compose ]
spring.datasource.url=jdbc:mysql://mysql-container:3306/docker_bmi_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=tejas
spring.datasource.password=mailpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Hibernate Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

